name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      # ── Portable: 항상 성공 ──────────────────────────────
      - name: Package portable (--dir)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Zip portable app
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\win-unpacked\* `
            -DestinationPath "dist\JsonlLogViewer-$tag-portable.zip"
        shell: pwsh

      # ── Installer: 실패해도 계속 ─────────────────────────
      - name: Package installer (--win)
        run: npx electron-builder --win --publish never
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ── 결과물 목록 확인 ─────────────────────────────────
      - name: List dist
        run: Get-ChildItem dist -Filter "*.exe","*.zip" | Select-Object Name, Length
        shell: pwsh

      # ── 둘 다 업로드 (있는 것만) ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
